[project]
name = "looksatwords"
version = "0.1.0"
description = "Gather, generate, analyze, and visualize language data"
authors = [
    {name = "Peter Kagstrom", email = "peter.kagstrom@gmail.com"},
]
dependencies = [
    "gnews>=0.3.7",
    "tinydb>=4.8.0",
    "ollama>=0.3.1",
    "pandas>=2.2.2",
    "pandera>=0.20.3",
    "bokeh>=3.5.1",
    "nltk>=3.8.1",
    "wordcloud>=1.9.3",
    "pytest>=8.3.2",
    "pytest-html>=4.1.1",
    "pytest-cov>=5.0.0",
    "pytest-sugar>=1.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.1.0",
    "playwright>=1.48.0",
    "ruff>=0.7.0",
    "trogon>=0.5.0",
    "click>=8.1.7",
    "ipykernel>=6.29.5",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "sqlmodel>=0.0.31",
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
keywords = ["language", "nlp", "data-analysis", "visualization", "news"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
looksatwords = "looksatwords.__main__:cli"

[tool.pytest.ini_options]
# The governance corpus is vendored at governance/qm and carries its own test
# suite, which asserts against the corpus root as the working directory. Left
# unbounded, this project's `pytest` collects those and reports a red suite
# for a file this repository does not own. `norecursedirs` is the half that
# still holds when pytest is handed an explicit path, which makes `testpaths`
# inert.
testpaths = ["looksatwords/tests"]
norecursedirs = ["governance", ".venv", "output", "node_modules"]
markers = [
    "e2e: end-to-end tests requiring browser (deselect with '-m \"not e2e\"')",
    "llm: reaches a live Ollama on loopback (deselect with '-m \"not llm\"')",
]
